name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: third_party/ipatool-shuttle/go.mod
          cache-dependency-path: third_party/ipatool-shuttle/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Localization audit
        run: pnpm i18n:check

      - name: Frontend tests
        run: pnpm test

      - name: Frontend coverage
        run: pnpm test:coverage

      - name: Frontend build
        run: pnpm build

      - name: Frontend dead-code audit
        run: pnpm knip

      - name: Frontend dependency audit
        run: pnpm audit --audit-level=low

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --release -- -D warnings

      - name: Rust dependency audit tools
        run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo install cargo-machete@0.9.2 --locked

      - name: Rust vulnerability audit
        working-directory: src-tauri
        run: cargo audit

      - name: Rust unused dependency audit
        working-directory: src-tauri
        run: cargo machete

      - name: Go formatting
        working-directory: third_party/ipatool-shuttle
        run: test -z "$(gofmt -l .)"

      - name: Go tests
        working-directory: third_party/ipatool-shuttle
        run: go test ./...

      - name: Go vet
        working-directory: third_party/ipatool-shuttle
        run: go vet ./...

      - name: Go vulnerability scan
        working-directory: third_party/ipatool-shuttle
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
